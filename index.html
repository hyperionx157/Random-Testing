<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcadeVault</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --accent: #f0c040;
    --accent2: #e05a2b;
    --text: #f0ede8;
    --muted: #7a7a8c;
    --border: rgba(255,255,255,0.07);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    pointer-events: none;
    z-index: 9999;
    opacity: 0.3;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(240,192,64,0.4);
  }

  .logo span { color: var(--accent2); }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .search-wrap {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .search-wrap:focus-within { border-color: var(--accent); }

  #searchBar {
    background: transparent;
    border: none;
    outline: none;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    width: 220px;
  }

  #searchBar::placeholder { color: var(--muted); }

  .search-icon {
    padding: 0 12px;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .search-icon:hover { color: var(--accent); }

  /* Main layout */
  .layout {
    display: flex;
    min-height: calc(100vh - 70px);
  }

  /* Sidebar */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    position: sticky;
    top: 70px;
    height: calc(100vh - 70px);
    overflow-y: auto;
  }

  .sidebar-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 10px;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    margin-bottom: 2px;
  }

  .nav-btn:hover { background: var(--surface); color: var(--text); }

  .nav-btn.active {
    background: rgba(240,192,64,0.12);
    color: var(--accent);
  }

  .nav-btn .icon { font-size: 17px; width: 20px; text-align: center; }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  /* Content */
  .content {
    flex: 1;
    padding: 2rem;
    min-width: 0;
  }

  .page-header {
    margin-bottom: 1.75rem;
    animation: fadeUp 0.35s ease both;
  }

  .page-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.04em;
    line-height: 1;
    margin-bottom: 6px;
  }

  .page-subtitle { color: var(--muted); font-size: 14px; }

  /* Game grid */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
    animation: fadeUp 0.4s 0.05s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .game-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    text-decoration: none;
    display: block;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: rgba(240,192,64,0.35);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  .card-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    position: relative;
    overflow: hidden;
  }

  .card-thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.5));
  }

  .card-body {
    padding: 12px 14px;
  }

  .card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 99px;
    background: rgba(240,192,64,0.12);
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  /* Featured banner */
  .featured {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem 2rem 2rem 2rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 2rem;
    animation: fadeUp 0.3s ease both;
    position: relative;
    overflow: hidden;
  }

  .featured::before {
    content: '';
    position: absolute;
    right: -40px; top: -40px;
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(240,192,64,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .featured-emoji { font-size: 5rem; flex-shrink: 0; }

  .featured-info { flex: 1; }

  .featured-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .featured-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .featured-desc { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 16px; }

  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: var(--accent);
    color: #000;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.15s, transform 0.1s;
  }

  .play-btn:hover { opacity: 0.88; transform: scale(1.03); }

  /* No results */
  .no-results {
    text-align: center;
    padding: 5rem 2rem;
    color: var(--muted);
  }

  .no-results .big { font-size: 3rem; margin-bottom: 12px; }
  .no-results p { font-size: 15px; }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 1.5rem 2rem;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .footer-btn {
    padding: 9px 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s, border-color 0.15s;
  }

  .footer-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  /* Mobile */
  @media (max-width: 700px) {
    .sidebar { display: none; }
    header { padding: 1rem; }
    #searchBar { width: 150px; }
    .content { padding: 1.25rem; }
    .featured { flex-direction: column; gap: 1rem; }
    .featured-emoji { font-size: 3rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Arcade<span>Vault</span></div>
  <div class="header-right">
    <div class="search-wrap">
      <input type="text" id="searchBar" placeholder="Search games…" oninput="onSearch()" />
      <span class="search-icon" onclick="onSearch()">⌕</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">Browse</div>
    <button class="nav-btn active" onclick="setCategory('all', this)"><span class="icon">🏠</span> All Games</button>
    <button class="nav-btn" onclick="setCategory('new', this)"><span class="icon">⭐</span> New</button>
    <hr class="divider">
    <div class="sidebar-title">Genre</div>
    <button class="nav-btn" onclick="setCategory('shooter', this)"><span class="icon">🔫</span> Shooter</button>
    <button class="nav-btn" onclick="setCategory('driving', this)"><span class="icon">🚗</span> Driving</button>
    <button class="nav-btn" onclick="setCategory('sports', this)"><span class="icon">🏀</span> Sports</button>
    <button class="nav-btn" onclick="setCategory('idle', this)"><span class="icon">⏳</span> Idle</button>
    <button class="nav-btn" onclick="setCategory('strategy', this)"><span class="icon">♟️</span> Strategy</button>
    <button class="nav-btn" onclick="setCategory('skill', this)"><span class="icon">⚡</span> Skill</button>
    <button class="nav-btn" onclick="setCategory('flash', this)"><span class="icon">👾</span> Flash</button>
    <hr class="divider">
    <div class="sidebar-title">Retro</div>
    <button class="nav-btn" onclick="setCategory('gba', this)"><span class="icon">🎮</span> GBA</button>
    <button class="nav-btn" onclick="setCategory('snes', this)"><span class="icon">🎮</span> SNES</button>
    <button class="nav-btn" onclick="setCategory('gbc', this)"><span class="icon">🎮</span> GBC</button>
    <button class="nav-btn" onclick="setCategory('n64', this)"><span class="icon">🎮</span> N64</button>
    <button class="nav-btn" onclick="setCategory('nes', this)"><span class="icon">🎮</span> NES</button>
    <button class="nav-btn" onclick="setCategory('pokemon', this)"><span class="icon">🔴</span> Pokémon</button>
    <hr class="divider">
    <button class="nav-btn" onclick="setCategory('papa', this)"><span class="icon">🍩</span> Papa Games</button>
    <button class="nav-btn" onclick="setCategory('roblox', this)"><span class="icon">☑️</span> Roblox Clones</button>
    <button class="nav-btn" onclick="setCategory('gambling', this)"><span class="icon">🃏</span> Gambling</button>
  </aside>

  <main class="content" id="content">
    <!-- Dynamically rendered -->
  </main>
</div>

<footer>
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSczP6XRDcjGEQJpXHWGcQEqMMAaSVYEINpcqbQx6Ti5y1jK0A/viewform?usp=dialog" target="_blank" class="footer-btn">📝 Suggest a Game</a>
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSdh6SqVwajDTQN9htRPJH6LtCHytRNSvL5XHjyOnbPdqiKJOQ/viewform?usp=dialog" target="_blank" class="footer-btn">❌ Report Blocked Game</a>
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSepO-HRMCXmZmLBzq-eh6Di5lRQKWp5kg9NnZWSNpqktperEQ/viewform?usp=dialog" target="_blank" class="footer-btn">⭐ Leave a Review</a>
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSdhvceZC4xlbEkCn-qjXGxK2jT__Ur42Bmd4TWYgCxeVVi0Zg/viewform?usp=dialog" target="_blank" class="footer-btn">🎞️ Movie Suggestions</a>
</footer>

<script>
// ============================================================
// ADD YOUR GAMES HERE
// Each category is an array of game objects with 3 fields:
//   name  — the display name shown on the card
//   url   — the filename or URL the card links to
//   emoji — an emoji shown as the card thumbnail
//
// Example entry:
//   { name: "My Cool Game", url: "mycoolGame.html", emoji: "🎮" }
//
// To add a game: copy one of the lines above, paste it inside
// the correct category array, and fill in your values.
// To add a whole new category: add a new key to the object,
// add a matching label in categoryLabels, and a nav button
// in the sidebar HTML.
// ============================================================

const games = {
  new:      [],
  shooter:  [],
  driving:  [],
  sports:   [],
  idle:     [],
  strategy: [],
  skill:    [],
  flash:    [],
  gba:      [],
  snes:     [],
  gbc:      [],
  n64:      [],
  nes:      [],
  pokemon:  [],
  papa:     [],
  roblox:   [],
  gambling: []
};

const categoryLabels = {
  all: "All Games", new: "New Games", shooter: "Shooter Games",
  driving: "Driving Games", sports: "Sports Games", idle: "Idle Games",
  strategy: "Strategy Games", skill: "Skill Games", flash: "Flash Games",
  gba: "Game Boy Advance", snes: "Super Nintendo", gbc: "Game Boy Color",
  n64: "Nintendo 64", nes: "NES", pokemon: "Pokémon Games",
  papa: "Papa's Games", roblox: "Roblox Clones", gambling: "Gambling"
};

let currentCategory = "all";

function allGames() {
  const seen = new Set();
  const out = [];
  for (const [cat, list] of Object.entries(games)) {
    for (const g of list) {
      const key = g.url;
      if (!seen.has(key)) { seen.add(key); out.push({...g, cat}); }
    }
  }
  return out.sort((a,b) => a.name.localeCompare(b.name));
}

function getList() {
  if (currentCategory === "all") return allGames();
  return (games[currentCategory] || []).map(g => ({...g, cat: currentCategory}));
}

function onSearch() {
  const q = document.getElementById("searchBar").value.toLowerCase().trim();
  if (q) {
    const all = allGames();
    const filtered = all.filter(g => g.name.toLowerCase().includes(q));
    renderContent("Search Results", filtered, `${filtered.length} result${filtered.length !== 1 ? "s" : ""} for "${q}"`);
  } else {
    render();
  }
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");
  document.getElementById("searchBar").value = "";
  render();
}

function render() {
  const list = getList();
  const label = categoryLabels[currentCategory] || "Games";
  renderContent(label, list);
}

function renderContent(title, list, subtitle) {
  const content = document.getElementById("content");
  const sub = subtitle || `${list.length} game${list.length !== 1 ? "s" : ""}`;

  let featuredHTML = "";
  if (currentCategory === "all" && !subtitle) {
    featuredHTML = `
      <div class="featured">
        <div class="featured-emoji">🎮</div>
        <div class="featured-info">
          <div class="featured-label">Welcome to ArcadeVault</div>
          <div class="featured-title">Your Unblocked Game Hub</div>
          <div class="featured-desc">Add your games to the script section and they'll show up here, sorted by category. Use the sidebar to browse or search above.</div>
        </div>
      </div>`;
  }

  let gridHTML = "";
  if (list.length === 0) {
    gridHTML = `<div class="no-results"><div class="big">🕹️</div><p>No games found. Try a different search.</p></div>`;
  } else {
    gridHTML = `<div class="game-grid">` + list.map(g => `
      <a class="game-card" href="${g.url}">
        <div class="card-thumb">${g.emoji}</div>
        <div class="card-body">
          <div class="card-name">${g.name}</div>
          <span class="card-tag">${categoryLabels[g.cat] || g.cat}</span>
        </div>
      </a>`).join("") + `</div>`;
  }

  content.innerHTML = `
    ${featuredHTML}
    <div class="page-header">
      <div class="page-title">${title}</div>
      <div class="page-subtitle">${sub}</div>
    </div>
    ${gridHTML}`;
}

render();

document.getElementById("searchBar").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.target.value = ""; render(); }
});
</script>
</body>
</html>
